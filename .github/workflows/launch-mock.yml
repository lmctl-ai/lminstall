name: launch-mock
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: launch-mock-${{ github.sha }}
  cancel-in-progress: true
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        provider: [claude, codex, gemini, copilot, opencode, kimi, qwen, pi, dsh, miniplayer, lmplayer, hermes, agy]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./
        with:
          providers: ${{ matrix.provider }}
      - uses: ./configure
        with:
          provider: ${{ matrix.provider }}
          backend: mock
          base-url: http://127.0.0.1:8080
          model: ${{ matrix.provider == 'gemini' && 'gemini-2.5-flash' || matrix.provider == 'agy' && 'gemini-3.8-flash' || 'mock-agent' }}
          credential-env: PROVIDER_MOCK_KEY
          profile-dir: ${{ github.workspace }}/artifacts/profile
      - name: Build qualification driver
        run: |
          go test ./...
          go build -o "$RUNNER_TEMP/mock-e2e.exe" ./cmd/lminstall-mock-e2e
      - name: Required launch arguments and credential boundary mutation controls
        if: matrix.os == 'ubuntu-24.04' && matrix.provider == 'claude'
        run: go run scripts/mutate-launch.go
      - name: Download checksummed lmmock release (mock API server is built in; no Node/compiler)
        run: '"$RUNNER_TEMP/mock-e2e.exe" --prepare "$RUNNER_TEMP/provider-mock-tools"'
      - name: Fetch lminspect (traffic recorder) to discover what each client needs mocked
        if: matrix.os == 'ubuntu-24.04'
        run: git clone --depth 1 https://github.com/lmctl-ai/lminspect "$RUNNER_TEMP/lminspect-src"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.os == 'ubuntu-24.04'
        with:
          go-version-file: ${{ runner.temp }}/lminspect-src/go.mod
          cache: false
      - name: Build lminspect
        if: matrix.os == 'ubuntu-24.04'
        run: go -C "$RUNNER_TEMP/lminspect-src" build -trimpath -o "$RUNNER_TEMP/lminspect" .
      - name: Configure real routing, run real tool, assert exact reply and audited POST
        env:
          PROVIDER: ${{ matrix.provider }}
          INSPECT: ${{ matrix.os == 'ubuntu-24.04' && format('{0}/lminspect', runner.temp) || '' }}
        run: |
          args=(--provider "$PROVIDER" --require-action-profile --lminstall "$(command -v lminstall)" --settings "$RUNNER_TEMP/provider-mock-tools/settings.json" --out artifacts)
          if [ -n "$INSPECT" ]; then args+=(--inspect "$INSPECT"); fi
          "$RUNNER_TEMP/mock-e2e.exe" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launch-${{ matrix.provider }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
