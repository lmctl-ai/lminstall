name: Aggregate installer regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/install/lmctl_release*'
      - 'cmd/lminstall/lmctl.go'
      - 'action.yml'
      - '.github/workflows/lmctl-aggregate.yml'
  pull_request:
    paths:
      - 'internal/install/lmctl_release*'
      - 'cmd/lminstall/lmctl.go'
      - 'action.yml'
      - '.github/workflows/lmctl-aggregate.yml'
permissions:
  contents: read
jobs:
  aggregate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify aggregate integrity, token isolation, root ownership and retries
        run: go test ./internal/install -run TestLmctl -count=1 -v
      - name: Build the Action's CLI
        run: go build -o aggregate-installer.exe ./cmd/lminstall
