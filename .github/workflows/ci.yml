name: ci
on:
  # Pushes to main run through release.yml, which calls this workflow and only
  # publishes binaries when it passes.
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Native source builds outlast unrelated configure/run commits. Retain the
  # exact-commit proof instead of repeatedly cancelling its slow platforms.
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  providers:
    name: providers-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-amd64}
          - {os: ubuntu-24.04-arm, name: linux-arm64}
          - {os: macos-15, name: darwin-arm64}
          - {os: macos-15-intel, name: darwin-amd64}
          - {os: windows-2022, name: windows-amd64}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      CI: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Unit tests and static build
        run: |
          go test ./...
          go vet ./...
          mkdir -p build
          go build -trimpath -ldflags='-s -w' -o build/lminstall.exe ./cmd/lminstall
      - name: Install, repeat, status, upgrade and uninstall the catalog (hermetic PATH, no npm/git/uv)
        run: python scripts/ci-providers.py build/lminstall.exe
      - name: Preserve provider results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-results-${{ matrix.name }}
          path: provider-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lminstall-${{ matrix.name }}
          path: build/lminstall.exe
  composite:
    name: action-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./
        id: setup
        with:
          providers: codex
      - shell: bash
        run: |
          codex --version
          python -c 'import json,subprocess; r=json.loads(subprocess.check_output(["lminstall","status","codex","--json"])); assert r[0]["state"]=="installed",r'
          lminstall uninstall codex
