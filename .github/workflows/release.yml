name: release
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 0.1.${{ github.run_number }}
jobs:
  # Unit tests plus real installs of every provider on Linux amd64/arm64,
  # macOS amd64/arm64 and Windows amd64, with no npm/git/uv on PATH.
  install-tests:
    uses: ./.github/workflows/ci.yml
  # Installed providers driven against the released lmmock API mock.
  mock-tests:
    uses: ./.github/workflows/launch-mock.yml
  oauth-tests:
    uses: ./.github/workflows/oauth-mock.yml
  build:
    needs: [install-tests, mock-tests, oauth-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-compile static binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; if [ "$os" = windows ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/lminstall-$os-$arch$ext" ./cmd/lminstall
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
  # GitHub Releases only. Nothing is published to npm or any other registry.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-binaries
          path: dist
      - name: Publish tested binaries and checksums
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already published."
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$tag" \
              --notes "Static lminstall binaries for Linux, macOS and Windows (amd64/arm64). Published only after every provider installed and ran against lmmock on Linux amd64/arm64, macOS amd64/arm64 and Windows amd64."
          fi
